<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十光年的距离</title>
<meta name="description" content="星尘十周年 · 曲目星图">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #05070f;
    --ink-2: #0a0f1d;
    --line: rgba(126, 216, 232, 0.22);
    --accent: #7ed8e8;
    --accent-warm: #f0c98a;
    --text: #dfe8f2;
    --text-dim: #8497ad;
    --panel-w: min(31rem, 34vw);
    --bow: 3.4vw;   /* 弧的凸出深度，相对 180vh 的高度极小 -> 巨圆 */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: fixed; inset: 0; display: block; }

  /* 背景星云：纯 CSS，位于画布之下 */
  #nebula {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 48vh at 22% 18%, rgba(64, 108, 168, 0.20), transparent 62%),
      radial-gradient(52vw 44vh at 82% 76%, rgba(150, 84, 168, 0.16), transparent 64%),
      radial-gradient(80vw 70vh at 50% 50%, rgba(20, 34, 62, 0.55), transparent 78%),
      var(--ink);
  }

  /* ── 左侧半圆叠加层 ───────────────────────────────── */
  /* 一个超大圆的截边：面板比视口高得多，右缘只是那个巨圆的一小段弧。
     水平圆角半径 --bow 远小于垂直半径，弧就很平缓；上下都溢出屏幕，
     看不到弧的收口，读起来才像"截了一小块"而不是半圆。 */
  #panel {
    position: fixed; left: 0; top: 50%;
    width: var(--panel-w); height: 180vh;
    transform: translateY(-50%);
    border-radius: 0 var(--bow) var(--bow) 0 / 0 50% 50% 0;
    background: linear-gradient(96deg,
                rgba(9, 16, 30, 0.95) 0%,
                rgba(8, 13, 26, 0.90) 60%,
                rgba(7, 12, 23, 0.72) 88%,
                rgba(7, 12, 23, 0.44) 100%);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    border-right: 1px solid rgba(126, 216, 232, 0.20);
    box-shadow: 30px 0 110px -40px rgba(50, 120, 168, 0.45);
    display: flex; align-items: center;
    z-index: 5;
  }

  #panel-inner {
    width: 100%;
    padding: 0 calc(var(--bow) + 1.3rem) 0 2.2rem;
    display: flex; flex-direction: column; gap: .66rem;
  }

  #cover {
    width: 100%; aspect-ratio: 16 / 10; border-radius: 10px;
    position: relative;
    background:
      radial-gradient(circle at 50% 45%, rgba(126, 216, 232, .34), transparent 62%),
      linear-gradient(150deg, #101d33, #0a1120);
    border: 1px solid rgba(126, 216, 232, .20);
    display: grid; place-items: center;
    font-size: 2rem; color: rgba(126, 216, 232, .55);
    overflow: hidden; flex: none;
  }
  #poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .4s ease;
  }
  #poster.on { opacity: 1; }
  #cover .glyph {
    width: 2.9rem; height: auto; opacity: .58;
    filter: drop-shadow(0 0 14px rgba(126, 216, 232, .45));
  }
  #cover.playing > .glyph, #cover.playing > #poster, #cover.playing > #play { display: none; }
  #cover iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* 点击封面才载入播放器，避免每次选星都拉一个 iframe */
  #play {
    position: absolute; inset: 0; z-index: 2; cursor: pointer;
    border: 0; background: transparent; display: grid; place-items: center;
    transition: background .25s ease;
  }
  #play:hover { background: rgba(4, 9, 18, .34); }
  #play::after {
    content: ""; width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: rgba(8, 14, 26, .74) url("data:image/svg+xml,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237ed8e8'>\
<path d='M9 6.5v11l9-5.5z'/></svg>") center/1.5rem no-repeat;
    border: 1px solid rgba(126, 216, 232, .5);
    box-shadow: 0 0 22px rgba(126, 216, 232, .28);
    transition: transform .2s ease;
  }
  #play:hover::after { transform: scale(1.09); }

  #author { font-size: .76rem; color: var(--text); letter-spacing: .02em; }
  #author em { font-style: normal; color: var(--text-dim); font-size: .66rem; margin-right: .4rem; }

  /* ── 搜索 ─────────────────────────────────────────── */
  #search-wrap { position: fixed; left: 2.4rem; top: 1.9rem; z-index: 7; width: min(24rem, 26vw); }
  #search {
    width: 100%; padding: .52rem .9rem;
    background: rgba(8, 14, 26, .82); color: var(--text);
    border: 1px solid rgba(126, 216, 232, .26); border-radius: 999px;
    font: inherit; font-size: .76rem; letter-spacing: .03em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    border-color: rgba(126, 216, 232, .6);
    box-shadow: 0 0 0 3px rgba(126, 216, 232, .10);
  }

  #results {
    margin-top: .5rem; max-height: 52vh; overflow-y: auto;
    background: rgba(7, 12, 23, .93); border: 1px solid rgba(126, 216, 232, .18);
    border-radius: 12px; display: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    scrollbar-width: thin; scrollbar-color: rgba(126,216,232,.3) transparent;
  }
  #results.on { display: block; }
  #results::-webkit-scrollbar { width: 6px; }
  #results::-webkit-scrollbar-thumb { background: rgba(126,216,232,.3); border-radius: 3px; }

  .hit {
    padding: .46rem .8rem; cursor: pointer; font-size: .7rem; line-height: 1.4;
    border-bottom: 1px solid rgba(126, 216, 232, .07);
  }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit.cur { background: rgba(126, 216, 232, .12); }
  .hit .n { color: var(--text); display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .s { color: var(--text-dim); font-size: .62rem; }
  .hit mark { background: none; color: var(--accent); }
  #results .none { padding: .6rem .8rem; font-size: .68rem; color: var(--text-dim); }

  #title {
    font-size: clamp(.82rem, 1.5vh, 1.02rem); line-height: 1.42; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .meta { font-size: clamp(.62rem, 1.06vh, .74rem); color: var(--text-dim); line-height: 1.7; }
  .meta b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }

  .rule {
    height: 1px; flex: none;
    background: linear-gradient(90deg, transparent, rgba(126,216,232,.34), transparent);
  }

  #star-line { font-size: clamp(.6rem, 1vh, .72rem); color: var(--accent-warm); letter-spacing: .02em; }

  #open {
    display: inline-block; margin-top: .1rem; padding: .34rem .8rem;
    font-size: .68rem; letter-spacing: .06em; text-decoration: none;
    color: var(--accent); border: 1px solid rgba(126,216,232,.35); border-radius: 999px;
    transition: background .2s, color .2s;
  }
  #open:hover { background: rgba(126,216,232,.14); color: #fff; }

  #empty { color: var(--text-dim); font-size: .78rem; line-height: 2.1; letter-spacing: .1em; }
  #empty span { display: block; color: var(--accent); font-size: 1.02rem; letter-spacing: .2em;
                margin-bottom: .3rem; }
  #empty b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ── 角落信息 ─────────────────────────────────────── */
  #brand {
    position: fixed; right: 2rem; top: 1.7rem; z-index: 5;
    pointer-events: none;
    display: flex; align-items: center; gap: .8rem; text-align: right;
    flex-direction: row-reverse;
  }
  #mark {
    flex: none; width: clamp(1.9rem, 4vh, 2.5rem); height: auto;
    filter: drop-shadow(0 0 12px rgba(126, 216, 232, .5));
  }
  #brand h1 {
    margin: 0; font-size: clamp(1.1rem, 2.4vh, 1.7rem); font-weight: 300;
    letter-spacing: .34em; color: #eaf4fb;
    text-shadow: 0 0 26px rgba(126,216,232,.45);
  }
  #brand p { margin: .42rem 0 0; font-size: .62rem; letter-spacing: .22em; color: var(--text-dim); }

  #tooltip {
    position: fixed; z-index: 8; pointer-events: none; opacity: 0;
    max-width: 21rem; padding: .38rem .62rem;
    background: rgba(6, 11, 22, .93); border: 1px solid rgba(126,216,232,.26);
    border-radius: 7px; font-size: .68rem; line-height: 1.45;
    transition: opacity .13s ease;
  }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--ink); transition: opacity .7s ease;
    letter-spacing: .3em; font-size: .7rem; color: var(--text-dim);
  }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 860px) {
    :root { --panel-w: 74vw; --bow: 7vw; }
    #panel-inner { padding: 0 calc(var(--bow) + 1rem) 0 1.3rem; }
    #search-wrap { left: 1rem; right: 1rem; top: auto; bottom: 1rem; width: auto; }
    #results { max-height: 38vh; }
    #brand { right: 1.1rem; top: 1.1rem; gap: .55rem; }
  }
</style>
</head>
<body>
<div id="nebula"></div>
<canvas id="stage"></canvas>

<div id="panel">
  <div id="panel-inner">
    <div id="empty"><span>十光年的距离</span><b id="count">—</b> 首曲目<br>各自对应一颗真实恒星<br>拖拽旋转 · 滚轮推拉 · 点击选中</div>
    <div id="detail" hidden>
      <div id="cover">
        <img class="glyph" src="./icon.svg" alt="" width="46" height="46">
        <img id="poster" alt="" referrerpolicy="no-referrer">
        <button id="play" type="button" aria-label="播放"></button>
      </div>
      <div id="title"></div>
      <div id="author"></div>
      <div class="rule"></div>
      <div class="meta" id="meta"></div>
      <div id="star-line"></div>
      <a id="open" target="_blank" rel="noopener">前往 BILIBILI</a>
    </div>
  </div>
</div>

<div id="search-wrap">
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="搜索曲名 / UP 主 / TYC 编号">
  <div id="results"></div>
</div>

<div id="brand">
  <img id="mark" src="./icon.svg" alt="" width="34" height="34">
  <div>
    <h1>十光年的距离</h1>
    <p>STARDUST · 10TH ANNIVERSARY</p>
  </div>
</div>

<div id="tooltip"></div>
<div id="loading">载入星表…</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
