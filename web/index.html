<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十光年的距离</title>
<meta name="description" content="星尘十周年 · 曲目星图">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #05070f;
    --accent: #f2c84b;
    --accent-warm: #ffe6b0;
    --reticle: #7ec8ff;
    --text: #dfe8f2;
    --text-dim: #8497ad;
    --ring-r: 19px;
    --panel-l: 22rem;
    --panel-r: 20rem;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: fixed; inset: 0; display: block; }

  #nebula {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 48vh at 22% 18%, rgba(64, 108, 168, 0.20), transparent 62%),
      radial-gradient(52vw 44vh at 82% 76%, rgba(150, 84, 168, 0.16), transparent 64%),
      radial-gradient(80vw 70vh at 50% 50%, rgba(20, 34, 62, 0.55), transparent 78%),
      var(--ink);
  }

  /* ── 选中 / 悬停标记与引线 ─────────────────────────── */
  #link-layer {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
  }
  #leader, #ring, #ring-glow, #hover-ring {
    fill: none; stroke: var(--accent); opacity: 0;
    transition: opacity .24s ease;
  }
  #leader { stroke-width: 1; stroke-dasharray: 3 4; }
  #ring { stroke-width: 1.4; }
  #ring-glow { stroke-width: 4; }
  #hover-ring { stroke-width: 1.4; transition: opacity .12s ease; }
  #link-layer.sel #leader { opacity: .62; }
  #link-layer.sel #ring { opacity: 1; }
  #link-layer.sel #ring-glow { opacity: .16; }
  #link-layer.hov #hover-ring { opacity: .4; }

  /* ── 中央指示器：上下各 120° 的蓝色半透明圆 ─────────── */
  #reticle {
    position: fixed; left: 50%; top: 50%; width: 148px; height: 148px;
    transform: translate(-50%, -50%);
    z-index: 4; pointer-events: none;
  }
  #reticle path { fill: none; stroke: var(--reticle); stroke-width: 1.6;
                  opacity: .38; stroke-linecap: round; }
  #reticle circle { fill: var(--reticle); opacity: .5; }

  /* ── 底部弧形仪表 ─────────────────────────────────── */
  #hud {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    z-index: 6; pointer-events: none;
  }
  #hud .track { fill: none; stroke: rgba(242, 200, 75, .14); stroke-width: 1.2; }
  #hud .fill  { fill: none; stroke: var(--accent); stroke-width: 2.2; opacity: .8;
                stroke-linecap: butt; filter: drop-shadow(0 0 4px rgba(242,200,75,.45)); }
  #hud .tick  { stroke: rgba(242, 200, 75, .26); stroke-width: 1; }
  #hud .zero  { stroke: rgba(242, 200, 75, .5); stroke-width: 1.4; }
  #speed-mark { fill: var(--accent); opacity: .9;
                filter: drop-shadow(0 0 5px rgba(242,200,75,.6)); }
  #hud.rev #speed-mark { fill: #ff9a6b; filter: drop-shadow(0 0 5px rgba(255,154,107,.7)); }

  #hud-labels {
    position: fixed; left: 0; right: 0; z-index: 7;
    display: flex; flex-direction: column; align-items: center; gap: .26rem;
    pointer-events: none; text-align: center;
  }
  #bgm-name {
    font-size: .66rem; letter-spacing: .16em; color: var(--accent-warm); opacity: .8;
    max-width: 24rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #hud-sub {
    font-size: .55rem; letter-spacing: .2em; color: var(--text-dim);
    display: flex; gap: 1.2rem; font-variant-numeric: tabular-nums;
  }
  #hud-sub b { color: var(--accent); font-weight: 500; }
  #hud-mode { transition: color .3s, text-shadow .3s; }
  body.auto #hud-mode { color: var(--accent); text-shadow: 0 0 10px rgba(242,200,75,.6); }
  #hud-rev { color: #ff9a6b; opacity: 0; transition: opacity .2s; }
  body.rev #hud-rev { opacity: 1; }

  /* ── 底部左右信息卡：梯形，外侧高、内侧矮 ───────────── */
  .hud-panel {
    position: fixed; bottom: 1.2rem; z-index: 6;
    background: linear-gradient(150deg, rgba(9, 15, 28, .62), rgba(7, 11, 21, .48));
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    opacity: 0; visibility: hidden;
    transition: opacity .28s ease, visibility .28s;
  }
  .hud-panel.on { opacity: 1; visibility: visible; }
  /* clip-path 会把 border 一起裁掉，边框改用内嵌 SVG 描边 */
  .panel-edge {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .panel-edge polygon {
    fill: none; stroke: rgba(242, 200, 75, .34); stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  #panel-left {
    left: 8vw; width: var(--panel-l);
    clip-path: polygon(0 0, 100% 14%, 100% 86%, 0 100%);
    padding: .7rem 1.5rem 1.5rem .7rem;
  }
  #panel-right {
    right: 8vw; width: var(--panel-r);
    clip-path: polygon(0 14%, 100% 0, 100% 100%, 0 86%);
    padding: 1.6rem .8rem 1.6rem 1.5rem;
    display: flex; flex-direction: column; gap: .4rem;
  }

  #cover {
    width: 100%; aspect-ratio: 16 / 10; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, rgba(242, 200, 75, .22), transparent 62%),
      linear-gradient(150deg, rgba(16,29,51,.7), rgba(10,17,32,.7));
    display: grid; place-items: center;
  }
  #cover .glyph { width: 2.8rem; height: auto; opacity: .45;
                  filter: drop-shadow(0 0 14px rgba(242, 200, 75, .45)); }
  #cover iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity .35s ease;
  }
  #cover iframe.on { opacity: 1; }

  #title {
    font-size: .8rem; line-height: 1.38; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rule { height: 1px; background: linear-gradient(90deg, rgba(242,200,75,.3), transparent); }
  .field {
    display: flex; justify-content: space-between; gap: .6rem;
    font-size: .6rem; line-height: 1.6;
  }
  .field span { color: var(--text-dim); letter-spacing: .13em; flex: none; }
  .field b {
    color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums;
    text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .field.hot b { color: var(--accent); }
  .field.warm b { color: var(--accent-warm); }

  /* ── 攻击指示器：相近曲目的槽位 ─────────────────────── */
  #targets { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .target {
    position: absolute; pointer-events: auto; cursor: pointer;
    display: flex; align-items: center; gap: .4rem;
    max-width: 13rem; padding: .18rem .42rem;
    font-size: .58rem; line-height: 1.35; letter-spacing: .02em;
    background: rgba(8, 14, 26, .5);
    border: 1px solid rgba(242, 200, 75, .22);
    opacity: 0; transition: opacity .3s ease, background .18s, border-color .18s;
  }
  #targets.on .target { opacity: .82; }
  .target:hover { opacity: 1; background: rgba(242, 200, 75, .16);
                  border-color: rgba(242, 200, 75, .55); }
  .target .t { flex: 1; min-width: 0; color: var(--text);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target .w { flex: none; color: var(--accent); font-size: .52rem;
               font-variant-numeric: tabular-nums; }
  .target.left { transform: translateY(-50%); }
  .target.right { transform: translate(-100%, -50%); flex-direction: row-reverse; }
  .target.right .t { text-align: right; }

  /* ── 搜索：常规圆角边框 ───────────────────────────── */
  #search-wrap { position: fixed; left: 2.4rem; top: 1.9rem; z-index: 8; width: min(22rem, 26vw); }
  #search {
    width: 100%; padding: .5rem .9rem;
    background: rgba(8, 14, 26, .7); color: var(--text);
    border: 1px solid rgba(242, 200, 75, .26); border-radius: 999px;
    font: inherit; font-size: .74rem; letter-spacing: .04em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    border-color: rgba(242, 200, 75, .6);
    box-shadow: 0 0 0 3px rgba(242, 200, 75, .10);
  }
  #results {
    margin-top: .45rem; max-height: 52vh; overflow-y: auto;
    background: rgba(7, 12, 23, .88); border: 1px solid rgba(242, 200, 75, .18);
    border-radius: 12px; display: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    scrollbar-width: thin; scrollbar-color: rgba(242,200,75,.3) transparent;
  }
  #results.on { display: block; }
  #results::-webkit-scrollbar { width: 6px; }
  #results::-webkit-scrollbar-thumb { background: rgba(242,200,75,.3); border-radius: 3px; }
  .hit {
    padding: .44rem .8rem; cursor: pointer; font-size: .68rem; line-height: 1.4;
    border-bottom: 1px solid rgba(242, 200, 75, .07);
  }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit.cur { background: rgba(242, 200, 75, .12); }
  .hit .n { color: var(--text); display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .s { color: var(--text-dim); font-size: .6rem; }
  .hit mark { background: none; color: var(--accent); }
  #results .none { padding: .6rem .8rem; font-size: .66rem; color: var(--text-dim); }

  /* ── 角落 ─────────────────────────────────────────── */
  #brand {
    position: fixed; right: 2.4rem; top: 1.7rem; z-index: 5; pointer-events: none;
    display: flex; align-items: center; gap: .8rem; text-align: right;
    flex-direction: row-reverse;
  }
  #mark { flex: none; width: clamp(1.9rem, 4vh, 2.4rem); height: auto;
          filter: drop-shadow(0 0 12px rgba(242, 200, 75, .5)); }
  #brand h1 { margin: 0; font-size: clamp(1rem, 2.2vh, 1.5rem); font-weight: 300;
              letter-spacing: .34em; color: #fdf4e0;
              text-shadow: 0 0 26px rgba(242,200,75,.45); }
  #brand p { margin: .38rem 0 0; font-size: .58rem; letter-spacing: .22em; color: var(--text-dim); }

  /* 巡游按钮：常规圆角胶囊 */
  #auto-btn {
    position: fixed; right: 2.4rem; top: 6.2rem; z-index: 9;
    display: flex; align-items: center; gap: .45rem;
    padding: .4rem .9rem .4rem .75rem;
    background: rgba(8, 14, 26, .7); color: var(--text-dim);
    border: 1px solid rgba(242, 200, 75, .26); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font: inherit; font-size: .62rem; letter-spacing: .12em; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  #auto-btn:hover { color: var(--text); border-color: rgba(242, 200, 75, .5); }
  #auto-btn::before {
    content: ""; width: .45rem; height: .45rem; border-radius: 50%;
    background: var(--text-dim); transition: background .25s, box-shadow .25s;
  }
  body.auto #auto-btn { color: var(--accent); border-color: rgba(242, 200, 75, .6); }
  body.auto #auto-btn::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  body.auto #search-wrap, body.auto #footer { opacity: 0; pointer-events: none; }
  #search-wrap, #footer { transition: opacity .4s ease; }

  #tooltip {
    position: fixed; z-index: 9; pointer-events: none; opacity: 0;
    max-width: 21rem; padding: .36rem .6rem;
    background: rgba(6, 11, 22, .9); border: 1px solid rgba(242,200,75,.26);
    border-radius: 7px; font-size: .66rem; line-height: 1.45;
    transition: opacity .13s ease;
  }

  #rotate-hint {
    display: none;
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
    z-index: 9; padding: .38rem .8rem;
    background: rgba(8, 14, 26, .8); color: var(--accent);
    border: 1px solid rgba(242, 200, 75, .3); border-radius: 999px;
    font-size: .6rem; letter-spacing: .1em; white-space: nowrap;
  }

  #footer {
    position: fixed; left: 0; right: 0; bottom: .7rem; z-index: 5;
    text-align: center; font-size: .55rem; letter-spacing: .1em;
    color: var(--text-dim); pointer-events: none; opacity: .75;
  }
  #footer a { color: var(--text-dim); text-decoration: none; pointer-events: auto;
              border-bottom: 1px solid rgba(242, 200, 75, .22); transition: color .2s; }
  #footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  #footer .sep { opacity: .45; margin: 0 .45rem; }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--ink); transition: opacity .7s ease; color: var(--text-dim);
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #load-inner { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
  #load-mark { width: 2.6rem; height: auto; opacity: .85;
               filter: drop-shadow(0 0 16px rgba(242, 200, 75, .5)); }
  #load-text { letter-spacing: .3em; font-size: .68rem; }
  #load-track { width: min(18rem, 52vw); height: 2px; border-radius: 2px;
                background: rgba(242, 200, 75, .16); overflow: hidden; }
  #load-bar { height: 100%; width: 0%; border-radius: 2px;
              background: linear-gradient(90deg, rgba(242,200,75,.5), var(--accent));
              transition: width .18s ease-out; }
  #load-pct { font-size: .62rem; letter-spacing: .14em;
              font-variant-numeric: tabular-nums; color: var(--accent); }

  /* 竖屏手机：弧形仪表与梯形卡片挤不下，退回上下叠放 */
  @media (max-width: 900px) and (orientation: portrait) {
    #hud, #hud-labels, #reticle, #targets { display: none; }
    #rotate-hint { display: block; }
    #panel-left, #panel-right {
      left: .7rem; right: .7rem; width: auto; bottom: auto;
      clip-path: none; padding: .7rem .8rem;
    }
    #panel-left { top: auto; bottom: 15.5rem; padding: .45rem; }
    #panel-right { top: auto; bottom: 3rem; max-height: 13rem; overflow-y: auto; }
    .panel-edge { display: none; }
    #panel-left, #panel-right { border: 1px solid rgba(242, 200, 75, .28); border-radius: 12px; }
    #cover { aspect-ratio: 16 / 9; }
    #footer { display: none; }
  }

  @media (max-width: 1100px) and (orientation: landscape) {
    :root { --panel-l: 15rem; --panel-r: 13rem; }
    #panel-left { left: 3vw; }
    #panel-right { right: 3vw; }
    #reticle { width: 100px; height: 100px; }
    #footer { display: none; }
  }

  @media (max-width: 900px) {
    #search-wrap { left: .7rem; top: .7rem; width: calc(100% - 4.4rem); }
    #results { max-height: 40vh; }
    #brand { right: .7rem; top: .7rem; gap: 0; }
    #brand h1, #brand p { display: none; }
    #mark { width: 2rem; }
    #auto-btn { right: .7rem; bottom: auto; top: 3.4rem; }
  }

  @media (pointer: coarse) {
    #stage { touch-action: none; }
    #tooltip { display: none; }
  }
</style>
</head>
<body>
<div id="nebula"></div>
<canvas id="stage"></canvas>

<svg id="reticle" viewBox="0 0 148 148" aria-hidden="true">
  <!-- 上下各 120°，左右各留 60° 缺口 -->
  <path d="M25.5 46 A56 56 0 0 1 122.5 46"/>
  <path d="M122.5 102 A56 56 0 0 1 25.5 102"/>
  <circle cx="74" cy="74" r="1.6"/>
</svg>

<svg id="link-layer" aria-hidden="true">
  <path id="leader"></path>
  <polygon id="ring-glow"></polygon>
  <polygon id="ring"></polygon>
  <polygon id="hover-ring"></polygon>
</svg>

<svg id="hud" aria-hidden="true">
  <path id="arc-bgm-bg" class="track"></path>
  <path id="arc-bgm" class="fill"></path>
  <path id="arc-speed-bg" class="track"></path>
  <g id="speed-ticks"></g>
  <line id="speed-zero" class="zero"></line>
  <polygon id="speed-mark"></polygon>
</svg>

<div id="hud-labels">
  <div id="bgm-name">—</div>
  <div id="hud-sub">
    <div id="hud-mode">手动</div>
    <div>速度 <b id="hud-speed">0.0</b> ly/s</div>
    <div id="hud-rev">倒车</div>
  </div>
</div>

<div id="panel-left" class="hud-panel">
  <svg class="panel-edge" viewBox="0 0 100 100" preserveAspectRatio="none">
    <polygon points="0,0 100,14 100,86 0,100"/>
  </svg>
  <div id="cover">
    <img class="glyph" src="./icon.svg" alt="" width="44" height="44">
  </div>
  <div id="title"></div>
</div>

<div id="panel-right" class="hud-panel">
  <svg class="panel-edge" viewBox="0 0 100 100" preserveAspectRatio="none">
    <polygon points="0,14 100,0 100,100 0,86"/>
  </svg>
  <div class="field"><span>UP 主</span><b id="f-author"></b></div>
  <div class="field"><span>投稿</span><b id="f-date"></b></div>
  <div class="field"><span>播放</span><b id="f-view"></b></div>
  <div class="rule"></div>
  <div class="field warm"><span>恒星</span><b id="f-tyc"></b></div>
  <div class="field warm"><span>光谱</span><b id="f-sp"></b></div>
  <div class="field warm"><span>视星等</span><b id="f-mag"></b></div>
</div>

<!-- 攻击指示器：相近曲目分布在屏幕中心两侧的弧上，每侧四个槽位 -->
<div id="targets"></div>

<div id="search-wrap">
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="搜索曲名 / UP 主 / TYC 编号">
  <div id="results"></div>
</div>

<div id="brand">
  <img id="mark" src="./icon.svg" alt="" width="34" height="34">
  <div>
    <h1>十光年的距离</h1>
    <p>STARDUST · 10TH ANNIVERSARY</p>
  </div>
</div>

<div id="tooltip"></div>
<div id="rotate-hint">横屏浏览可获得完整仪表</div>

<button id="auto-btn" type="button">自动巡游</button>
<audio id="bgm" preload="none"></audio>

<div id="footer">
  星表 Tycho-2 · Hipparcos<span class="sep">/</span>音频特征 MERT-v1-95M
  <span class="sep">/</span><a href="https://github.com/wuyilingwei/10lightyears"
     target="_blank" rel="noopener">开源仓库</a>
  <span class="sep">/</span><a href="https://www.cloudflare.com/"
     target="_blank" rel="noopener">Powered by Cloudflare</a>
</div>

<div id="loading">
  <div id="load-inner">
    <img id="load-mark" src="./icon.svg" alt="">
    <div id="load-text">载入星表</div>
    <div id="load-track"><div id="load-bar"></div></div>
    <div id="load-pct">0%</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
