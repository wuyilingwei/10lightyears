<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十光年的距离</title>
<meta name="description" content="星尘十周年 · 曲目星图">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #05070f;
    --line: rgba(242, 200, 75, 0.22);
    --accent: #f2c84b;
    --accent-warm: #ffe6b0;
    --text: #dfe8f2;
    --text-dim: #8497ad;
    --col-w: 22rem;
    --ring-r: 19px;   /* 选中六边形的外接圆半径，屏幕像素 */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: fixed; inset: 0; display: block; }

  /* 背景星云：纯 CSS，位于画布之下 */
  #nebula {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 48vh at 22% 18%, rgba(64, 108, 168, 0.20), transparent 62%),
      radial-gradient(52vw 44vh at 82% 76%, rgba(150, 84, 168, 0.16), transparent 64%),
      radial-gradient(80vw 70vh at 50% 50%, rgba(20, 34, 62, 0.55), transparent 78%),
      var(--ink);
  }

  /* 连线层：屏幕空间 SVG，把信息框接到选中星 */
  /* SVG 是替换元素，固有尺寸 300x150，inset:0 撑不开它，必须显式给宽高 */
  #link-layer {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
    opacity: 0; transition: opacity .3s ease;
  }
  #link-layer.on { opacity: 1; }
  #leader { fill: none; stroke: var(--accent); stroke-width: 1;
            stroke-dasharray: 3 4; opacity: .62; }
  #ring { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  #ring-glow { fill: none; stroke: var(--accent); stroke-width: 4; opacity: .16; }

  /* 信息框：选中才出现，浮在星场上 */
  #infobox {
    position: fixed; left: 3.4rem; top: 50%; transform: translateY(-50%);
    width: var(--col-w); z-index: 6;
    display: flex; flex-direction: column; gap: .62rem;
    padding: 1rem 1.1rem 1.05rem;
    border-radius: 14px;
    background: linear-gradient(150deg, rgba(9, 15, 28, .93), rgba(7, 11, 21, .86));
    border: 1px solid rgba(242, 200, 75, .26);
    box-shadow: 0 20px 60px -24px rgba(0, 0, 0, .9),
                0 0 40px -18px rgba(242, 200, 75, .35);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    opacity: 0; visibility: hidden;
    transition: opacity .28s ease, visibility .28s;
  }
  #infobox.on { opacity: 1; visibility: visible; }
  #detail { display: flex; flex-direction: column; gap: .62rem; }

  #cover {
    width: 100%; aspect-ratio: 16 / 10; border-radius: 10px;
    position: relative;
    background:
      radial-gradient(circle at 50% 45%, rgba(242, 200, 75, .30), transparent 62%),
      linear-gradient(150deg, #101d33, #0a1120);
    border: 1px solid rgba(242, 200, 75, .20);
    display: grid; place-items: center;
    overflow: hidden; flex: none;
  }
  #poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .4s ease;
  }
  #poster.on { opacity: 1; }
  #cover .glyph {
    width: 3.2rem; height: auto; opacity: .58;
    filter: drop-shadow(0 0 14px rgba(242, 200, 75, .45));
  }
  #cover.playing > .glyph, #cover.playing > #poster, #cover.playing > #play { display: none; }
  #cover iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* 点击封面才载入播放器，避免每次选星都拉一个 iframe */
  #play {
    position: absolute; inset: 0; z-index: 2; cursor: pointer;
    border: 0; background: transparent; display: grid; place-items: center;
    transition: background .25s ease;
  }
  #play:hover { background: rgba(4, 9, 18, .34); }
  #play::after {
    content: ""; width: 2.8rem; height: 2.8rem; border-radius: 50%;
    background: rgba(8, 14, 26, .74) url("data:image/svg+xml,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f2c84b'>\
<path d='M9 6.5v11l9-5.5z'/></svg>") center/1.6rem no-repeat;
    border: 1px solid rgba(242, 200, 75, .5);
    box-shadow: 0 0 22px rgba(242, 200, 75, .28);
    transition: transform .2s ease;
  }
  #play:hover::after { transform: scale(1.09); }

  #title {
    font-size: clamp(.84rem, 1.5vh, 1.04rem); line-height: 1.42; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #author { font-size: .78rem; color: var(--text); letter-spacing: .02em; }
  #author em { font-style: normal; color: var(--text-dim); font-size: .66rem; margin-right: .4rem; }

  .rule {
    height: 1px; flex: none;
    background: linear-gradient(90deg, rgba(242,200,75,.34), transparent);
  }

  .meta { font-size: clamp(.63rem, 1.06vh, .75rem); color: var(--text-dim); line-height: 1.7; }
  .meta b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }

  #star-line { font-size: clamp(.61rem, 1vh, .73rem); color: var(--accent-warm); letter-spacing: .02em; }

  /* ── 相近曲目：默认折叠 ───────────────────────────── */
  #links { font-size: .7rem; }
  #links summary {
    cursor: pointer; list-style: none; user-select: none;
    color: var(--text-dim); letter-spacing: .04em;
    padding: .3rem 0; display: flex; align-items: center; gap: .4rem;
  }
  #links summary::-webkit-details-marker { display: none; }
  #links summary::before {
    content: "▸"; color: var(--accent); font-size: .62rem;
    transition: transform .2s ease; display: inline-block;
  }
  #links[open] summary::before { transform: rotate(90deg); }
  #links summary:hover { color: var(--text); }
  #links summary b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }

  #link-list {
    max-height: 15rem; overflow-y: auto;
    border-left: 1px solid rgba(242, 200, 75, .18); padding-left: .6rem;
    scrollbar-width: thin; scrollbar-color: rgba(242,200,75,.3) transparent;
  }
  #link-list::-webkit-scrollbar { width: 5px; }
  #link-list::-webkit-scrollbar-thumb { background: rgba(242,200,75,.3); border-radius: 3px; }

  .link {
    display: flex; gap: .5rem; align-items: baseline;
    padding: .26rem .3rem; cursor: pointer; border-radius: 5px;
    line-height: 1.35;
  }
  .link:hover { background: rgba(242, 200, 75, .12); }
  .link .t {
    flex: 1; min-width: 0; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link .w {
    flex: none; color: var(--accent); font-size: .6rem;
    font-variant-numeric: tabular-nums;
  }

  /* ── 搜索 ─────────────────────────────────────────── */
  #search-wrap { position: fixed; left: 3.4rem; top: 1.9rem; z-index: 7; width: min(22rem, 26vw); }
  #search {
    width: 100%; padding: .52rem .9rem;
    background: rgba(8, 14, 26, .82); color: var(--text);
    border: 1px solid rgba(242, 200, 75, .26); border-radius: 999px;
    font: inherit; font-size: .76rem; letter-spacing: .03em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    border-color: rgba(242, 200, 75, .6);
    box-shadow: 0 0 0 3px rgba(242, 200, 75, .10);
  }

  #results {
    margin-top: .5rem; max-height: 52vh; overflow-y: auto;
    background: rgba(7, 12, 23, .93); border: 1px solid rgba(242, 200, 75, .18);
    border-radius: 12px; display: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    scrollbar-width: thin; scrollbar-color: rgba(242,200,75,.3) transparent;
  }
  #results.on { display: block; }
  #results::-webkit-scrollbar { width: 6px; }
  #results::-webkit-scrollbar-thumb { background: rgba(242,200,75,.3); border-radius: 3px; }

  .hit {
    padding: .46rem .8rem; cursor: pointer; font-size: .7rem; line-height: 1.4;
    border-bottom: 1px solid rgba(242, 200, 75, .07);
  }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit.cur { background: rgba(242, 200, 75, .12); }
  .hit .n { color: var(--text); display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .s { color: var(--text-dim); font-size: .62rem; }
  .hit mark { background: none; color: var(--accent); }
  #results .none { padding: .6rem .8rem; font-size: .68rem; color: var(--text-dim); }

  /* ── 角落信息 ─────────────────────────────────────── */
  #brand {
    position: fixed; right: 2rem; top: 1.7rem; z-index: 5;
    pointer-events: none;
    display: flex; align-items: center; gap: .8rem; text-align: right;
    flex-direction: row-reverse;
  }
  #mark {
    flex: none; width: clamp(1.9rem, 4vh, 2.5rem); height: auto;
    filter: drop-shadow(0 0 12px rgba(242, 200, 75, .5));
  }
  #brand h1 {
    margin: 0; font-size: clamp(1.1rem, 2.4vh, 1.7rem); font-weight: 300;
    letter-spacing: .34em; color: #fdf4e0;
    text-shadow: 0 0 26px rgba(242,200,75,.45);
  }
  #brand p { margin: .42rem 0 0; font-size: .62rem; letter-spacing: .22em; color: var(--text-dim); }

  #tooltip {
    position: fixed; z-index: 8; pointer-events: none; opacity: 0;
    max-width: 21rem; padding: .38rem .62rem;
    background: rgba(6, 11, 22, .93); border: 1px solid rgba(242,200,75,.26);
    border-radius: 7px; font-size: .68rem; line-height: 1.45;
    transition: opacity .13s ease;
  }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--ink); transition: opacity .7s ease;
    letter-spacing: .3em; font-size: .7rem; color: var(--text-dim);
  }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 860px) {
    :root { --col-w: min(20rem, 62vw); }
    #infobox { left: 1.2rem; }
    #search-wrap { left: 1rem; right: 1rem; top: auto; bottom: 1rem; width: auto; }
    #results { max-height: 38vh; }
    #link-list { max-height: 9rem; }
    #brand { right: 1.1rem; top: 1.1rem; gap: .55rem; }
  }
</style>
</head>
<body>
<div id="nebula"></div>
<canvas id="stage"></canvas>

<svg id="link-layer" aria-hidden="true">
  <path id="leader"></path>
  <polygon id="ring-glow"></polygon>
  <polygon id="ring"></polygon>
</svg>

<div id="infobox">
  <div id="detail">
    <div id="cover">
      <img class="glyph" src="./icon.svg" alt="" width="52" height="52">
      <img id="poster" alt="" referrerpolicy="no-referrer">
      <button id="play" type="button" aria-label="播放"></button>
    </div>
    <div id="title"></div>
    <div id="author"></div>
    <div class="rule"></div>
    <div class="meta" id="meta"></div>
    <div id="star-line"></div>
    <details id="links">
      <summary>相近曲目 <b id="link-count">0</b> 首</summary>
      <div id="link-list"></div>
    </details>
  </div>
</div>

<div id="search-wrap">
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="搜索曲名 / UP 主 / TYC 编号">
  <div id="results"></div>
</div>

<div id="brand">
  <img id="mark" src="./icon.svg" alt="" width="34" height="34">
  <div>
    <h1>十光年的距离</h1>
    <p>STARDUST · 10TH ANNIVERSARY</p>
  </div>
</div>

<div id="tooltip"></div>
<div id="loading">载入星表…</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
