<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="十光年的距离">
  <defs>
    <linearGradient id="tri-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f2c84b" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="tri-down" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f2c84b" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <!-- 六芒星正视图：两枚等边三角形对插，重叠处自然形成内六边形 -->
  <g stroke="#f2c84b" stroke-width="1.5" stroke-linejoin="round">
    <path d="M16 3.2 27.26 22.7 4.74 22.7Z" fill="url(#tri-up)"/>
    <path d="M16 28.8 4.74 9.3 27.26 9.3Z" fill="url(#tri-down)"/>
  </g>

  <!-- 内六边形的轮廓，把交叠关系点出来 -->
  <path d="M11.37 16 13.69 12 18.31 12 20.63 16 18.31 20 13.69 20Z"
        fill="none" stroke="#ffe9a8" stroke-width=".9" stroke-linejoin="round" opacity=".78"/>

  <circle cx="16" cy="16" r="1.35" fill="#fff6dd"/>
  <circle cx="16" cy="16" r="3" fill="#f2c84b" opacity=".22"/>
</svg>
